<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="surf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f9"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#14203c" flood-opacity="0.12"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a86a3"/>
    </marker>
  </defs>

  <rect width="860" height="420" rx="20" fill="#f6f8fc"/>
  <text x="34" y="46" font-size="21" font-weight="800" fill="#0e1526">Recall — architecture</text>
  <text x="34" y="68" font-size="13" fill="#5b6478">Alexa+ track · self-hosted MCP server (Streamable HTTP, spec 2025-11-25) · Amazon Bedrock · SM-2</text>

  <!-- Clients -->
  <g filter="url(#sh)">
    <rect x="34" y="110" width="190" height="86" rx="14" fill="url(#surf)" stroke="#e2e8f4"/>
  </g>
  <text x="129" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#0e1526">Alexa+ / MCP client</text>
  <text x="129" y="164" text-anchor="middle" font-size="11.5" fill="#5b6478">voice intents → tool calls</text>
  <text x="129" y="181" text-anchor="middle" font-size="11.5" fill="#5b6478">speaks tool responses</text>

  <g filter="url(#sh)">
    <rect x="34" y="230" width="190" height="86" rx="14" fill="url(#surf)" stroke="#e2e8f4"/>
  </g>
  <text x="129" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#0e1526">Web simulator</text>
  <text x="129" y="284" text-anchor="middle" font-size="11.5" fill="#5b6478">browser Web Speech API</text>
  <text x="129" y="301" text-anchor="middle" font-size="11.5" fill="#5b6478">the permitted demo path</text>

  <!-- Server surfaces -->
  <g filter="url(#sh)">
    <rect x="330" y="96" width="196" height="70" rx="14" fill="url(#brand)"/>
  </g>
  <text x="428" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">recall.server</text>
  <text x="428" y="146" text-anchor="middle" font-size="11.5" fill="#e9ecff">FastMCP · /mcp · Streamable HTTP</text>

  <g filter="url(#sh)">
    <rect x="330" y="258" width="196" height="70" rx="14" fill="url(#surf)" stroke="#e2e8f4"/>
  </g>
  <text x="428" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#0e1526">recall.webapp</text>
  <text x="428" y="308" text-anchor="middle" font-size="11.5" fill="#5b6478">Starlette · / + /api/*</text>

  <!-- Core -->
  <g filter="url(#sh)">
    <rect x="330" y="185" width="196" height="52" rx="12" fill="#0e1526"/>
  </g>
  <text x="428" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">recall.core</text>
  <text x="428" y="227" text-anchor="middle" font-size="11" fill="#aeb8d0">add · next · grade · progress</text>

  <!-- Dependencies -->
  <g filter="url(#sh)"><rect x="636" y="104" width="190" height="66" rx="13" fill="url(#surf)" stroke="#e2e8f4"/></g>
  <text x="731" y="132" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0e1526">Amazon Bedrock</text>
  <text x="731" y="151" text-anchor="middle" font-size="11" fill="#5b6478">Converse — make + grade cards</text>

  <g filter="url(#sh)"><rect x="636" y="184" width="190" height="54" rx="13" fill="url(#surf)" stroke="#e2e8f4"/></g>
  <text x="731" y="209" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0e1526">srs · SM-2</text>
  <text x="731" y="226" text-anchor="middle" font-size="11" fill="#5b6478">interval · easiness · due</text>

  <g filter="url(#sh)"><rect x="636" y="252" width="190" height="54" rx="13" fill="url(#surf)" stroke="#e2e8f4"/></g>
  <text x="731" y="277" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0e1526">store · JSON</text>
  <text x="731" y="294" text-anchor="middle" font-size="11" fill="#5b6478">per-user cards, due tracking</text>

  <!-- edges -->
  <g stroke="#7a86a3" stroke-width="2" fill="none">
    <path d="M224 150 L326 131" marker-end="url(#arw)"/>
    <path d="M224 274 L326 293" marker-end="url(#arw)"/>
    <path d="M428 166 L428 183" marker-end="url(#arw)"/>
    <path d="M428 258 L428 239" marker-end="url(#arw)"/>
    <path d="M526 205 L632 140" marker-end="url(#arw)"/>
    <path d="M526 210 L632 211" marker-end="url(#arw)"/>
    <path d="M526 216 L632 278" marker-end="url(#arw)"/>
  </g>
  <text x="270" y="140" font-size="10.5" fill="#7a86a3">MCP</text>
  <text x="250" y="286" font-size="10.5" fill="#7a86a3">HTTP</text>
</svg>
